# Task runner (https://taskfile.dev). Same commands on Windows, Linux and CI.
#   go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

vars:
  API_DIR: services/api
  WEB_DIR: apps/web

tasks:
  default:
    cmds: [task --list]
    silent: true

  # --- Local stack -----------------------------------------------------------
  up:
    desc: Build and start the full local stack (MySQL, LocalStack, Mailpit, API, web)
    cmds: [docker compose up -d --build]

  down:
    desc: Stop the local stack (keeps data volumes)
    cmds: [docker compose down]

  reset:
    desc: Stop the stack and delete its volumes (wipes the local database)
    cmds: [docker compose down -v]

  logs:
    desc: "Follow logs, e.g. task logs -- api"
    cmds: ["docker compose logs -f {{.CLI_ARGS}}"]

  ps:
    desc: Show stack status
    cmds: [docker compose ps]

  # --- Aggregates ------------------------------------------------------------
  lint:
    desc: Lint API and web
    deps: [api:lint, web:check]

  test:
    desc: All tests, including MySQL integration tests (needs Docker)
    deps: [api:test, web:check, web:test]

  build:
    desc: Build API binary and web bundle
    deps: [api:build, web:build]

  # --- API (Go) --------------------------------------------------------------
  api:lint:
    desc: golangci-lint on the API
    dir: "{{.API_DIR}}"
    cmds: [golangci-lint run ./...]

  api:fmt:
    desc: Format Go code
    dir: "{{.API_DIR}}"
    cmds: [golangci-lint fmt ./...]

  api:test:
    desc: Unit + integration tests (testcontainers starts MySQL)
    dir: "{{.API_DIR}}"
    vars:
      # -race needs cgo (a C compiler), which Windows dev machines usually lack. CI always runs it.
      RACE: '{{if ne OS "windows"}}-race{{end}}'
    cmds: ["go test {{.RACE}} -count=1 ./..."]

  api:test:unit:
    desc: Unit tests only (skips anything that needs Docker)
    dir: "{{.API_DIR}}"
    cmds: [go test -short -count=1 ./...]

  api:build:
    desc: Build the duradent binary
    dir: "{{.API_DIR}}"
    cmds: ["go build -o bin/duradent{{exeExt}} ./cmd/duradent"]

  migrate:
    desc: Apply migrations to the local MySQL from docker compose
    cmds: [docker compose run --rm migrate]

  seed:
    desc: Load the demo catalog (skipped if price lists already exist; use `task reset` first to reload)
    cmds: [docker compose run --rm seed]

  # --- Web (Astro) -----------------------------------------------------------
  web:install:
    dir: "{{.WEB_DIR}}"
    cmds: [npm ci]

  web:dev:
    desc: Astro dev server on the host (outside Docker)
    dir: "{{.WEB_DIR}}"
    cmds: [npm run dev]

  web:check:
    desc: astro check (types + diagnostics)
    dir: "{{.WEB_DIR}}"
    cmds: [npm run check]

  web:test:
    desc: Web unit tests (Vitest)
    dir: "{{.WEB_DIR}}"
    cmds: [npm test]

  web:build:
    dir: "{{.WEB_DIR}}"
    cmds: [npm run build]

  web:gen-api:
    desc: Regenerate TS types from services/api/openapi.yaml
    dir: "{{.WEB_DIR}}"
    cmds: [npm run gen:api]

  # --- infrastructure (phase 6) ------------------------------------------------------

  tf:fmt:
    desc: Format Terraform
    cmds: [terraform fmt -recursive infra/terraform]

  tf:validate:
    desc: Validate every Terraform root (no AWS credentials needed)
    cmds:
      - for: [shared, envs/staging, envs/prod]
        cmd: terraform -chdir=infra/terraform/{{.ITEM}} init -backend=false -input=false >/dev/null && terraform -chdir=infra/terraform/{{.ITEM}} validate

  tf:plan:
    desc: "Plan one environment: task tf:plan -- staging"
    dir: infra/terraform/envs/{{.CLI_ARGS}}
    cmds:
      - terraform init -input=false -backend-config=../../backend.hcl -backend-config="key={{.CLI_ARGS}}.tfstate"
      - terraform plan -input=false

  deploy:
    desc: "Roll an image tag out: task deploy -- staging <git-sha>"
    cmds: ["bash infra/scripts/deploy.sh {{.CLI_ARGS}}"]

  # Staging exists only while it is needed (ADR 51). Its secrets (Culqi sandbox,
  # Nubefact demo…) are reloaded on every start from the file in STAGING_SECRETS.
  staging:up:
    desc: "Create staging and deploy main (or a SHA): STAGING_SECRETS=app.json task staging:up [-- <git-sha>]"
    cmds:
      - |
        set -e
        tag="{{.CLI_ARGS}}"
        tag="${tag:-$(git rev-parse origin/main)}"
        tf="terraform -chdir=infra/terraform/envs/staging"
        $tf init -input=false -backend-config=../../backend.hcl -backend-config="key=staging.tfstate"
        $tf apply -input=false -var "image_tag=${tag}"
        if [ -z "${STAGING_SECRETS:-}" ]; then
          echo "Staging was created without secrets. Load them and deploy:"
          echo "  aws secretsmanager put-secret-value --secret-id duradent-staging/app --secret-string file://app.json"
          echo "  task deploy -- staging ${tag}"
          exit 0
        fi
        aws secretsmanager put-secret-value --secret-id duradent-staging/app --secret-string "file://${STAGING_SECRETS}" >/dev/null
        bash infra/scripts/deploy.sh staging "${tag}"
        echo "Staging is up at https://staging.duradent.pe (point its DNS at: $($tf output -raw alb_dns_name))"

  staging:down:
    desc: Destroy staging, database included (costs nothing while down)
    prompt: Esto borra staging completo, incluida su base de datos. ¿Seguir?
    cmds:
      - terraform -chdir=infra/terraform/envs/staging init -input=false -backend-config=../../backend.hcl -backend-config="key=staging.tfstate"
      - terraform -chdir=infra/terraform/envs/staging destroy -input=false
